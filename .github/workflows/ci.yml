name: CI Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '!v*prebuild*'
      - '!v*preview*'
      - '!v*-*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish build as GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Explicit version tag, for example v0.2.0-preview.1'
        required: false
        type: string
      prerelease:
        description: 'Mark publication as a preview'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Windows x64 Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Validate Release Metadata
        id: release
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: node scripts/prepare-github-release.mjs

      - name: Frontend Parity Regressions
        run: |
          node scripts/verify-release-metadata.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-ui-parity-release.mjs

      - name: Frontend Type-Check & Build
        run: npm run build

      - name: Verify Native Notification Adapter
        shell: pwsh
        run: powershell.exe -NoProfile -File scripts/build-desktop-notifications.ps1 -OutDir "$env:RUNNER_TEMP/native-notifications" -Test

      - name: Run Backend Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Prepare Verified Installer Tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-ci-installer-tools.ps1 -ToolsRoot (Join-Path $env:LOCALAPPDATA tauri)

      - name: Build Tauri Application & Installers
        run: npm run tauri build -- --ci

      - name: Collect Dist Artifacts
        id: collect_artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $metadata = & cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Cargo output directory' }
          $release = Join-Path ($metadata | ConvertFrom-Json).target_directory 'release'
          $out = Join-Path $env:GITHUB_WORKSPACE 'dist-artifacts'
          $portable = Join-Path $env:RUNNER_TEMP "codex-light-package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $out,"$portable/licenses/themes" | Out-Null
          $files = @{
            "bundle/msi/Codex Light_${version}_x64_en-US.msi" = "Codex-Light_${version}_x64_en-US.msi"
            "bundle/nsis/Codex Light_${version}_x64-setup.exe" = "Codex-Light_${version}_x64-setup.exe"
          }
          foreach ($entry in $files.GetEnumerator()) {
            $source = Join-Path $release $entry.Key
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing required artifact: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $out $entry.Value)
          }
          $exe = Join-Path $release 'codex-tauri.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing required artifact: $exe" }
          Copy-Item -LiteralPath $exe -Destination $portable
          foreach ($name in @('THIRD-PARTY-NOTICES','SHIKI-THEMES-LICENSE','GITHUB-LICENSE','DRACULA-LICENSE','SOURCES.md')) {
            Copy-Item -LiteralPath "src/themes/$name" -Destination "$portable/licenses/themes/$name"
          }
          Compress-Archive -Path "$portable/*" -DestinationPath "$out/Codex-Light_${version}_windows-x64.zip"
          Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -LiteralPath "$out/SHA256SUMS.txt" -Encoding utf8NoBOM
          Get-ChildItem -LiteralPath $out -File | Select-Object Name,Length

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-light-windows-x64
          path: dist-artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Revalidate Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node scripts/prepare-github-release.mjs --revalidate-remote

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release.outputs.notes }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          overwrite_files: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
