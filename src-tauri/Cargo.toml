[package]
name = "codex-tauri"
version = "0.1.0"
description = "Native Tauri v2 client for OpenAI Codex App-Server"
authors = ["Codex Offline Contributors"]
edition = "2021"

[lib]
name = "codex_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "rt-multi-thread", "macros", "fs"] }
portable-pty = "0.8"
toml = "0.8"
toml_edit = "0.22"
base64 = "0.22"
dirs = "5.0"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[profile.dev]
debug = 0

[profile.test]
debug = 0

